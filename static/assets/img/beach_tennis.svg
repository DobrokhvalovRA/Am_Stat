<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- circular frame split green/orange -->
  <defs>
    <style>
      .stroke { stroke:#123A66; stroke-width:14; stroke-linecap:round; stroke-linejoin:round; fill:none; }
      .bg-split { fill:#43B17A; }
      .bg-split2 { fill:#F17A3A; }
      .icon-fill { fill:#ffffff; }
      .accent { fill:#123A66; }
    </style>
  </defs>
  <circle cx="256" cy="256" r="236" class="stroke" fill="none"/>
  <!-- left half -->
  <path d="M20 256a236 236 0 0 1 236-236v236z" class="bg-split"/>
  <!-- right half -->
  <path d="M492 256a236 236 0 0 0-236-236v236z" class="bg-split2"/>
  <!-- inner white background circle to create ring look -->
  <circle cx="256" cy="256" r="172" fill="#FFFFFF"/>
  <!-- paddle (beach tennis) -->
  <g transform="translate(0,0)">
    <path d="M330 180c-6-8-18-12-28-8l-78 30c-10 4-18 15-18 26v8c0 11 8 22 18 26l78 30c10 4 22 0 28-8 8-10 8-26 0-36l-46-54 46-54c8-10 8-26 0-36z" class="accent" fill="#123A66"/>
    <path d="M316 186c-4-6-12-8-18-6l-66 26c-6 2-10 8-10 14v6c0 6 4 12 10 14l66 26c6 2 14 0 18-6 6-8 6-20 0-28l-40-48 40-48c6-8 6-20 0-28z" fill="#ffffff" stroke="#123A66" stroke-width="8" stroke-linejoin="round"/>
    <!-- grip -->
    <rect x="226" y="312" width="18" height="58" rx="6" ry="6" fill="#123A66" transform="rotate(-30 235 341)"/>
    <!-- ball -->
    <circle cx="370" cy="160" r="28" class="accent" fill="#123A66"/>
    <path d="M358 150c8 4 18 0 24 6" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>