{% extends "base.html" %}
{% block title %}Установка пароля{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header bg-info text-white text-center">
                    <h2 class="mb-0"><i class="bi bi-key"></i> Установка нового пароля</h2>
                </div>
                <div class="card-body">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} text-center">{{ message }}</div>
                        {% endfor %}
                    {% endif %}

                    <form method="post" autocomplete="off">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="password1" class="form-label">Новый пароль</label>
                            <input type="password" class="form-control" id="password1" name="password1" minlength="8" required placeholder="Введите новый пароль">
                            <small class="form-text text-muted">Минимум 8 символов</small>
                        </div>
                        <div class="mb-3">
                            <label for="password2" class="form-label">Повторите пароль</label>
                            <input type="password" class="form-control" id="password2" name="password2" minlength="8" required placeholder="Повторите новый пароль">
                        </div>
                        <div class="d-flex gap-2 pt-2">
                            <button type="submit" class="btn btn-success w-100">
                                <i class="bi bi-check"></i> Сохранить
                            </button>
                            <a href="{% url 'profile' %}" class="btn btn-outline-secondary w-100">
                                <i class="bi bi-x-circle"></i> Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
