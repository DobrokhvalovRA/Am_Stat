{% extends "base.html" %}
{% block title %}Удаление турнира{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-4">Привет, {{ user.first_name }}!</h1>

    <div class="d-flex justify-content-end mb-4 gap-2">
        <a href="{% url 'profile' %}" class="btn btn-outline-primary">
            <i class="bi bi-person-circle"></i> Профиль
        </a>
        <a href="{% url 'logout' %}" class="btn btn-outline-danger">
            <i class="bi bi-box-arrow-right"></i> Выйти
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h2 class="mb-0"><i class="bi bi-trash"></i> Удалить турнир: {{ object.name }}</h2>
                </div>
                <div class="card-body bg-light">
                    <form method="post">
                        {% csrf_token %}
                        <p class="fs-5 mb-4 text-center text-danger">
                            Вы уверены, что хотите удалить турнир <strong>{{ object.name }}</strong>?
                        </p>
                        <div class="d-flex gap-2 justify-content-center">
                            <button type="submit" class="btn btn-danger px-4">
                                <i class="bi bi-trash"></i> Удалить
                            </button>
                            <a href="{% url 'profile' %}" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-x-circle"></i> Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
